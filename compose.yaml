services:
  shelfbridge:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4318"
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - shelfbridge-runtime:/app/.runtime
      # Current, sanitized P00 and Qloo-only HTTP evidence; never credentials.
      - ./test-results:/app/test-results:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:4318/api/health');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  shelfbridge-runtime:
